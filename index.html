<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Published Books</title>
    <meta
      name="description"
      content="A catalog of published books with blurbs, publication dates, word counts, and downloadable PDFs."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <p class="eyebrow">Author library</p>
        <h1>Published Books</h1>
        <p class="intro">
          A curated catalogue of the books I have published, each with a short blurb,
          key publication details, and a direct PDF download link.
        </p>
      </div>
    </header>

    <main class="container">
      <section class="stats" aria-label="Book statistics">
        <div class="stat-card">
          <span class="label">Books</span>
          <strong id="book-count">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Total words</span>
          <strong id="total-words">0</strong>
        </div>
        <div class="stat-card">
          <span class="label">Latest year</span>
          <strong id="latest-year">—</strong>
        </div>
      </section>

      <section class="books-section">
        <div id="book-list" class="book-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
